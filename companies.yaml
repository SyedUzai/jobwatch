# ─────────────────────────────────────────────────────────────────────────────
# jobwatch config. Edit freely; run `python jobwatch.py --check` after changes.
#
# Source types:
#   greenhouse / ashby / lever  → whole public job board (fast, reliable)
#   workday                     → Workday careers API, searched with search_queries
#                                 (paced + cookies to avoid 429s; falls back to the browser)
#   eightfold                   → Eightfold career sites (Nvidia)
#   tesla                       → Tesla's careers feed
#
# Browser sources can also set `pages: 2` + `page_param: page` to read result page 2.
#   amazon                      → amazon.jobs search API (covers Annapurna Labs)
#   browser                     → opens the careers search page in headless Chrome and
#                                 collects job links matching `link` (for custom sites)
#
# Status notes: [verified] = confirmed working Nov 2026. [check] = best-known setup,
# confirm with --check on first run and fix if it fails.
# ─────────────────────────────────────────────────────────────────────────────

filters:
  # A job alerts only if its TITLE contains at least one `include` term
  # (whole-word, case-insensitive) and none of the `exclude` terms.
  include:
    - post-silicon
    - post silicon
    - silicon validation
    - silicon performance
    - performance
    - characterization
    - bring-up
    - bringup
    - validation engineer
    - new grad
    - new college grad
    - new college graduate
    - college graduate
    - university graduate
    - early career
    - NCG
    - intern
    - internship
    # wording gaps found Nov 2026
    - perf
    - bring up
    - post-si
    - post si
    - graduate
    - entry level
    - entry-level
    - engineer I
    - engineer 1
    - university grad
    - class of 2027
    - "2027"
    - architect
    - silicon test
    - silicon debug
    - systems validation
    - system validation
    - hardware validation
    - benchmarking
  exclude:
    - senior
    - sr
    - staff
    - principal
    - distinguished
    - fellow
    - director
    - manager
    - head of
    - lead
    - co-op
    - marketing
    - sales
    - recruiter
    - finance
    - legal
    - solutions architect
  # Phrases ignored by the exclude check, so "staff" in these doesn't knock a job out.
  # AI startups (OpenAI, xAI, Etched, MatX, Cerebras) title most engineers "Member of Technical Staff".
  exclude_exceptions:
    - member of technical staff
    - technical staff
  # Location must contain one of these (whole-word). Jobs with no location shown are kept.
  # Delete the whole list to allow any location.
  locations:
    - United States
    - USA
    - US
    - Canada
    - Ontario
    - Toronto
    - Markham
    - Remote
    - California
    - Texas
    - Washington
    - Oregon
    - Massachusetts
    - CA
    - TX
    - WA
    - OR
    - MA
    - Santa Clara
    - San Jose
    - Sunnyvale
    - Mountain View
    - Cupertino
    - Palo Alto
    - Menlo Park
    - Milpitas
    - San Francisco
    - San Diego
    - Austin
    - Seattle
    - Redmond
    - Bellevue
    - Portland
    - Hillsboro
    - Boston
    - U.S.
    - Ottawa
    - Kanata
    - Waterloo
    - Vancouver
    - Montreal
    - Arizona
    - AZ
    - Chandler
    - Phoenix
    - Tempe
    - Colorado
    - CO
    - Fort Collins
    - Boulder
    - North Carolina
    - NC
    - Durham
    - Raleigh
    - New York
    - NY
    - Georgia
    - GA
    - Atlanta
    - Utah
    - UT
    - Florida
    - FL
    - Pennsylvania
    - PA
    - Minnesota
    - MN
    - Illinois
    - IL
    - Michigan
    - MI
    - New Jersey
    - NJ
    - Virginia
    - VA
    - Idaho
    - Boise
    - Folsom
    - Irvine
    - Los Angeles
    - Plano
    - Allen
    - Dallas
    - Houston
    - Kirkland
    - Beaverton
    - Hudson
    - Westford

# Search terms used by workday / amazon sources (unless a source sets its own `queries`).
search_queries:
  - post silicon
  - silicon validation
  - silicon performance
  - performance engineer
  - performance architect
  - new college grad
  - new grad
  - bring up

# Search terms used by browser sources. Keep this short — each term is one page load per company.
browser_queries:
  - post silicon
  - silicon validation
  - performance engineer
  - performance architect
  - new college grad

# Send a warning push if a source fails this many runs in a row.
alert_after_failures: 3

# Optional: skip alerts for listings posted more than this many days ago (where the site shows a
# date). 0 = off — alert on everything.
max_age_days: 0

# If a run takes longer than this, the remaining companies are skipped (and counted as failures)
# so the run still sends its alerts and saves. GitHub kills runs after 25 minutes.
run_budget_minutes: 16

sources:
  # ── GPU / CPU / SoC vendors ──────────────────────────────────────────────
  - name: Nvidia
    type: eightfold
    host: jobs.nvidia.com
    domain: nvidia.com

  - name: AMD                          # [check]
    type: browser
    url: "https://careers.amd.com/careers-home/jobs?keywords={query}&sortBy=posted_date&descending=true"
    link: "/jobs/\\d+"
    pages: 2
    page_param: page

  - name: Qualcomm                     # [check]
    type: browser
    url: "https://careers.qualcomm.com/careers?query={query}&sort_by=timestamp"
    link: "/job/\\d+"

  - name: Apple                        # [check]
    type: browser
    url: "https://jobs.apple.com/en-us/search?search={query}&sort=newest"
    link: "/details/[\\w-]+"
    pages: 2
    page_param: page

  - name: Intel                        # [check]
    type: workday
    host: intel.wd1.myworkdayjobs.com
    tenant: intel
    site: External

  - name: Arm                          # [check]
    type: browser
    url: "https://careers.arm.com/search-jobs/{query}"
    link: "/job/"

  - name: Samsung                      # [check] Samsung Semiconductor US
    type: workday
    host: sec.wd3.myworkdayjobs.com
    tenant: sec
    site: Samsung_Careers

  - name: MediaTek                     # turned off: little US hiring for this role
    enabled: false
    type: browser
    url: "https://careers.mediatek.com/"
    link: "job"

  # ── Hyperscaler in-house silicon ─────────────────────────────────────────
  - name: Google                       # [check]
    type: browser
    url: "https://www.google.com/about/careers/applications/jobs/results/?q={query}&sort_by=date"
    link: "jobs/results/\\d+"
    pages: 2
    page_param: page

  - name: Amazon / Annapurna           # [verified]
    type: amazon
    queries:
      - post-silicon
      - silicon validation
      - annapurna performance
      - trainium

  - name: Meta                         # [check]
    type: browser
    url: "https://www.metacareers.com/jobsearch?q={query}"
    link: "(job_details|jobs)/\\d+"

  - name: Microsoft                    # [check]
    type: browser
    url: "https://apply.careers.microsoft.com/careers?query={query}&sort_by=timestamp"
    link: "job/\\d+"

  - name: OpenAI                       # [verified]
    type: ashby
    board: openai

  # ── Custom ASIC houses ───────────────────────────────────────────────────
  - name: Broadcom                     # [check]
    type: workday
    host: broadcom.wd1.myworkdayjobs.com
    tenant: broadcom
    site: External_Career

  - name: Marvell                      # [check]
    type: workday
    host: marvell.wd1.myworkdayjobs.com
    tenant: marvell
    site: MarvellCareers

  # ── AI accelerator startups ──────────────────────────────────────────────
  - name: Tenstorrent                  # [verified]
    type: greenhouse
    board: tenstorrent

  - name: Etched                       # [verified]
    type: ashby
    board: etched

  - name: Groq                         # moved its job board from Greenhouse to Gem
    type: browser
    url: "https://jobs.gem.com/groq"
    link: "jobs\\.gem\\.com/groq/[\\w-]+"

  - name: xAI                          # separate company from Groq (makes Grok)
    type: greenhouse
    board: xai

  - name: Cerebras                     # [check]
    type: browser
    url: "https://www.cerebras.ai/open-positions"
    link: "(greenhouse\\.io|lever\\.co|ashbyhq\\.com|/open-positions/.+|/job)"

  - name: SambaNova                    # [check] only counts links to real job-board postings
    type: browser
    url: "https://sambanova.ai/company/careers/job-openings"
    link: "(greenhouse\\.io/.+/jobs?/|lever\\.co/.+/[0-9a-f-]{20,}|ashbyhq\\.com/.+/[0-9a-f-]{20,}|workable\\.com/.+/j/|myworkdayjobs\\.com/.+/job/|jobs\\.gem\\.com/.+/|rippling\\.com/.+/jobs/|bamboohr\\.com/careers/\\d+)"

  - name: MatX                         # [verified]
    type: ashby
    board: matx

  - name: d-Matrix                     # [verified] Ashby board
    type: ashby
    board: d-Matrix

  - name: Lightmatter                  # [verified]
    type: greenhouse
    board: lightmatter

  # ── Automotive / edge ────────────────────────────────────────────────────
  - name: Tesla                        # heavily bot-protected; may still be blocked from GitHub
    type: tesla
    url: "https://www.tesla.com/careers/search/?site=US"

  - name: Waymo                        # [verified]
    type: greenhouse
    board: waymo

  - name: Rivian                       # [check]
    type: browser
    url: "https://careers.rivian.com/careers-home/jobs?keywords={query}&sortBy=posted_date&descending=true"
    link: "/jobs/\\d+"
    pages: 2
    page_param: page
