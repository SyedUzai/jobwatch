name: jobwatch

on:
  schedule:
    - cron: "17 * * * *"     # hourly backup; the reliable 15-min trigger comes from cron-job.org (see README)
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      test_alert:
        description: "Just send a test notification to my phone/email"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check for new jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python jobwatch.py ${{ inputs.test_alert && '--test-alert' || '' }}

      - name: Save state
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
