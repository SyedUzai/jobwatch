name: jobwatch

on:
  schedule:
    - cron: "17 * * * *"     # hourly backup; the reliable 15-min trigger comes from cron-job.org (see README)
  workflow_dispatch:         # lets you run it manually from the Actions tab (and cron-job.org uses this)
    inputs:
      test_alert:
        description: "Just send a test notification to my phone/email"
        type: boolean
        default: false
      digest:
        description: "Send me a list of every open job that matches my filters right now"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check for new jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: >-
          python jobwatch.py
          ${{ inputs.test_alert && '--test-alert' || '' }}
          ${{ inputs.digest && '--digest' || '' }}

      - name: Save state
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen jobs" && git pull --rebase -q && git push)

      - name: Tell me if the run crashed
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -H "Title: jobwatch run failed" -H "Tags: warning" -H "Click: $RUN_URL" \
               -d "The job watcher crashed or timed out. Tap to see the log." "https://ntfy.sh/$NTFY_TOPIC"
