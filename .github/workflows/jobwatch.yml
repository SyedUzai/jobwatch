name: jobwatch

on:
  schedule:
    - cron: "17 * * * *"     # hourly backup; the reliable 15-min trigger comes from cron-job.org (see README)
  workflow_dispatch:         # lets you run it manually from the Actions tab (and cron-job.org uses this)
    inputs:
      test_alert:
        description: "Just send a test notification to my phone/email"
        type: boolean
        default: false
      digest:
        description: "Send me a list of every open job that matches my filters right now"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit when the run starts, not when it was triggered

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check for new jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: >-
          python jobwatch.py
          ${{ inputs.test_alert && '--test-alert' || '' }}
          ${{ inputs.digest && '--digest' || '' }}

      - name: Save state
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            # Fold in anything another run saved meanwhile, then commit on top of the latest version.
            git fetch -q origin "$BRANCH"
            git show "origin/$BRANCH:seen.json" > /tmp/remote_seen.json 2>/dev/null || : > /tmp/remote_seen.json
            python jobwatch.py --merge-state /tmp/remote_seen.json
            git reset -q --mixed "origin/$BRANCH"
            git add seen.json
            git diff --cached --quiet && exit 0
            git commit -q -m "update seen jobs"
            git push -q origin "HEAD:$BRANCH" && exit 0
            echo "Push raced with another run, retrying ($attempt)"; sleep 5
          done
          exit 1

      - name: Tell me if the run crashed
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -H "Title: jobwatch run failed" -H "Tags: warning" -H "Click: $RUN_URL" \
               -d "The job watcher crashed or timed out. Tap to see the log." "https://ntfy.sh/$NTFY_TOPIC"
